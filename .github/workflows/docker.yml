name: Docker build check

# convene is self-hosted on the local Docker lab (built with
# `docker compose up -d --build` on the host and exposed via Cloudflare
# Tunnel). There is no registry push or remote deploy — this workflow only
# verifies the image still builds so breakage is caught before merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on a self-hosted runner on the lab host itself — GitHub's own hosted
  # runners can't reach this private host. Gated to push-to-main ONLY
  # (never pull_request) so untrusted PR code can never execute here; this
  # job only ever runs post-merge, already-trusted code, and only after the
  # build-check job above confirms the image still builds (convene has no
  # test suite — both client/server package.json `scripts.test` are
  # literally "none", so the build check IS the gate here). Delegates the
  # actual deploy to lab-sentinel's own guarded engine rather than
  # reimplementing docker-compose logic here.
  deploy:
    name: Deploy to lab
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    steps:
      - name: Trigger lab-sentinel deploy
        run: |
          curl -sf -X POST http://127.0.0.1:7891/api/deploy \
            -H 'Content-Type: application/json' \
            -d '{"repo":"convene","containerName":"convene-app-1"}' \
            -o deploy-result.json
          cat deploy-result.json
          jq -e '.deployStatus == "done"' deploy-result.json
