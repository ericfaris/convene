<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- The in-app logo (client/public/logo.svg: orange calendar-cell C + green
     confirmed-date dot) on a paper tile. #mark-small blows it up for favicons. -->
<defs><symbol id="logo" viewBox="0 0 256 256">
  <rect x="31" y="31" width="58" height="58" rx="16" fill="#F97316"/><rect x="99" y="31" width="58" height="58" rx="16" fill="#F97316"/><rect x="167" y="31" width="58" height="58" rx="16" fill="#F97316"/>
  <rect x="31" y="99" width="58" height="58" rx="16" fill="#F97316"/>
  <rect x="31" y="167" width="58" height="58" rx="16" fill="#F97316"/><rect x="99" y="167" width="58" height="58" rx="16" fill="#F97316"/><rect x="167" y="167" width="58" height="58" rx="16" fill="#F97316"/>
  <circle cx="128" cy="128" r="22" fill="#65A30D"/>
</symbol></defs>
<g id="bg"><rect width="512" height="512" fill="#FFFBF5"/></g>
<g id="mark"><use href="#logo" x="32" y="32" width="448" height="448"/></g>
<g id="mark-small"><use href="#logo" x="-16" y="-16" width="544" height="544"/></g>
</svg>
